[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa_ai_model_training"
version = "0.1.0"
description = "Machine learning models for predicting optimized QAOA parameters from problem graphs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["qaoa", "quantum-computing", "graph-neural-networks", "max-cut"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "torch>=2.0",
    "lightning>=2.0.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "networkx>=3.0",
    "rustworkx>=0.13",
    "qiskit>=2.0",
    "qiskit-optimization>=0.7",
    "PyYAML>=6.0",
    "tqdm>=4.60",
    "tensorboard>=2.12.0",
    "matplotlib>=3.7",
    "qiskit-aer",
    "qaoa_training_pipeline @ git+https://github.com/qiskit-community/qaoa_training_pipeline",
    "quimb>=1.8.2",
    "cotengra<=0.8.1",
]

[project.optional-dependencies]
# Julia backend for PPEvaluator, only required for QAOA depth p > 1 (see README).
julia = [
    "qaoa_training_pipeline[tns] @ git+https://github.com/qiskit-community/qaoa_training_pipeline",
    "juliacall<0.9.35",
]
# Compiled PyTorch Geometric stack, only required for the gcn, graph_isomorphism_network,
# and graph_transformer models. Install after torch, with --no-build-isolation (see README).
graph = [
    "torch-geometric>=2.3.0",
    "torch-scatter>=2.1.0",
    "torch-sparse>=0.6.17",
    "torch-cluster>=1.6.1",
]
notebooks = ["jupyterlab>=4.0", "seaborn>=0.13", "plotly>=6.0"]
dev = ["pytest>=7.0", "ruff>=0.6", "pre-commit>=3.5", "nbstripout>=0.7"]

[tool.setuptools]
packages = [
    "datamodule",
    "ml_models",
    "training",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts_and_notebooks/_sweep_gnn_size"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 (line length) is handled by the formatter; B008 fires on the argparse and
# Path defaults used throughout the scripts.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Deliberate import-before-torch ordering, documented inline against
# https://github.com/pytorch/pytorch/issues/78829
"__init__.py" = ["F401", "E402"]
"datamodule/*.py" = ["E402"]
"training/*.py" = ["E402"]
"tests/*.py" = ["E402"]
